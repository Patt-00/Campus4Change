apply plugin: "com.android.application"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    if (providers.gradleProperty("c4cQaEmulators").orNull == "true") {
        debuggableVariants = []
        extraPackagerArgs = ["--dev", "true"]
    }
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // Only the Termux build needs QEMU for React Native's x86_64 Linux compiler.
    // Desktop builds use the React Native Gradle plugin's OS-aware default.
    if (providers.gradleProperty("termuxBuild").orNull == "true") {
        hermesCommand = "$rootDir/../scripts/hermesc-qemu.sh"
    }
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

// Track runtime configuration that lives outside the JavaScript source folder.
// Version changes affect AboutScreen, and Firebase config selects production or
// local emulators for a build.
def appPackageJson = rootProject.file("../package.json")
def appFirebaseConfig = rootProject.file("../src/shared/backend/firebaseConfig.js")
tasks.configureEach { task ->
    if (task.name.startsWith("createBundle") && task.name.endsWith("JsAndAssets")) {
        task.inputs.file(appPackageJson).withPropertyName("applicationPackageJson")
        task.inputs.file(appFirebaseConfig).withPropertyName("firebaseAppConfig")
    }
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

def releaseSigningValues = [
    storeFile: System.getenv("C4C_RELEASE_STORE_FILE"),
    storePassword: System.getenv("C4C_RELEASE_STORE_PASSWORD"),
    keyAlias: System.getenv("C4C_RELEASE_KEY_ALIAS"),
    keyPassword: System.getenv("C4C_RELEASE_KEY_PASSWORD"),
]
// Use a per-machine debug key for Google sign-in testing without registering
// the public, repository-tracked debug certificate with Firebase.
def debugSigningStorePath = System.getenv("C4C_DEBUG_STORE_FILE")?.trim()
def debugSigningStoreFile = debugSigningStorePath
    ? file(debugSigningStorePath)
    : file('debug.keystore')
if (debugSigningStorePath && !new File(debugSigningStorePath).isAbsolute()) {
    throw new GradleException("C4C_DEBUG_STORE_FILE must be an absolute path.")
}
if (!debugSigningStoreFile.isFile()) {
    throw new GradleException("The selected debug signing keystore does not exist.")
}
def releaseSigningConfigured = (
    releaseSigningValues.values().every { value ->
        value instanceof String && !value.trim().isEmpty()
    } && new File(releaseSigningValues.storeFile ?: "").isAbsolute()
        && file(releaseSigningValues.storeFile ?: "").isFile()
)
def c4cQaEmulatorsEnabled = providers.gradleProperty("c4cQaEmulators").orNull == "true"
def c4cQaApplicationIdSuffix = providers.gradleProperty("c4cQaApplicationIdSuffix").orNull
if (c4cQaApplicationIdSuffix != null) {
    if (!c4cQaEmulatorsEnabled) {
        throw new GradleException("C4C QA application ID suffix requires the emulator-QA build flag.")
    }
    if (!(c4cQaApplicationIdSuffix ==~ /^\.[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)*$/)) {
        throw new GradleException("C4C QA application ID suffix must start with a dot and use valid package segments.")
    }
}
def appProject = project

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.campus4change"
    defaultConfig {
        applicationId "com.campus4change"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 7
        versionName "1.4.0"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DCMAKE_SYSTEM_VERSION=24"
                if (providers.gradleProperty("termuxBuild").orNull == "true") {
                    arguments "-DCMAKE_PROJECT_INCLUDE=${file('../../scripts/termux-prefab.cmake').absolutePath}"
                }
            }
        }
    }
    signingConfigs {
        debug {
            storeFile debugSigningStoreFile
            storePassword System.getenv("C4C_DEBUG_STORE_PASSWORD") ?: 'android'
            keyAlias System.getenv("C4C_DEBUG_KEY_ALIAS") ?: 'androiddebugkey'
            keyPassword System.getenv("C4C_DEBUG_KEY_PASSWORD") ?: 'android'
        }
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            if (c4cQaApplicationIdSuffix != null) {
                applicationIdSuffix c4cQaApplicationIdSuffix
            }
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseArtifactsRequested = taskGraph.allTasks.any { task ->
        task.project == appProject &&
            ["assembleRelease", "bundleRelease", "packageRelease", "installRelease"].contains(task.name)
    }
    if (releaseArtifactsRequested && !releaseSigningConfigured) {
        throw new GradleException(
            "Release builds require a dedicated keystore. Set C4C_RELEASE_STORE_FILE, " +
                "C4C_RELEASE_STORE_PASSWORD, C4C_RELEASE_KEY_ALIAS, and C4C_RELEASE_KEY_PASSWORD. " +
                "Debug builds continue to use the debug keystore."
        )
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-splashscreen:1.2.0")
    implementation(platform("com.google.firebase:firebase-bom:34.19.0"))
    releaseImplementation("com.google.firebase:firebase-appcheck-playintegrity")
    debugImplementation("com.google.firebase:firebase-appcheck-debug")
    implementation("androidx.credentials:credentials:1.6.0")
    implementation("androidx.credentials:credentials-play-services-auth:1.6.0")
    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.1")
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
