name: Campus4Change CI

on:
  push:
    branches:
      - main
      - 'codex/firebase-auth-firestore'
  pull_request:
    branches:
      - main
      - 'codex/firebase-auth-firestore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4c-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install the Android NDK used by the project
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check for public Google Drive links
        run: npm run check:public-drive-links

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Android local unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Compile Android instrumentation tests
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Firestore rules and Auth emulator tests
        env:
          C4C_ALLOW_FIRESTORE_EMULATOR_RESET: '1'
        run: >-
          npx --yes firebase-tools@15.33.0 emulators:exec
          --only auth,firestore
          --project demo-campus4change-rules
          "npm run test:firestore-rules && npm run test:booking-overlap && npm run test:group-client-rules && npm run test:firebase-auth"

      - name: Production Android bundle and release Kotlin compile
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          :app:createBundleReleaseJsAndAssets
          :app:compileReleaseKotlin

      - name: Android debug build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify release packaging requires a dedicated key
        working-directory: android
        shell: bash
        run: |
          set +e
          release_output=$(./gradlew --no-daemon --dry-run assembleRelease 2>&1)
          release_status=$?
          set -e

          if [ "$release_status" -eq 0 ]; then
            printf '%s\n' "$release_output"
            echo "Release build unexpectedly accepted missing signing credentials."
            exit 1
          fi

          if ! grep -Fq "Release builds require a dedicated keystore." <<<"$release_output"; then
            printf '%s\n' "$release_output"
            echo "Release build failed for a reason other than missing signing credentials."
            exit 1
          fi

          echo "Release signing guard rejected missing credentials as expected."

  api24-instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Run minimum API Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          target: default
          arch: x86
          profile: pixel_2
          ram-size: 1024M
          ndk: 27.1.12297006
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
          working-directory: android

  macos-clean-build:
    # Run only when manually dispatched; keep macOS build minutes off normal PR checks.
    if: github.event_name == 'workflow_dispatch'
    name: Clean Android debug build on macOS
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${HOME}/Library/Android/sdk}"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          printf 'sdk.dir=%s\n' "$sdk_root" > android/local.properties

      - name: Install JavaScript dependencies from lockfile
        run: npm ci

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify package, version, and signature
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          sdk_root="${ANDROID_HOME:-${HOME}/Library/Android/sdk}"
          metadata="$("$sdk_root/build-tools/37.0.0/aapt" dump badging "$apk" | sed -n '1p')"
          printf '%s\n' "$metadata"
          grep -Fq "package: name='com.campus4change' versionCode='7' versionName='1.4.0'" <<<"$metadata"
          "$sdk_root/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          shasum -a 256 "$apk"
