name: Campus4Change CI

on:
  push:
    branches:
      - main
      - 'codex/firebase-auth-firestore'
  pull_request:
    branches:
      - main
      - 'codex/firebase-auth-firestore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4c-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install the Android NDK used by the project
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check for public Google Drive links
        run: npm run check:public-drive-links

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Android local unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Firestore rules and Auth emulator tests
        env:
          C4C_ALLOW_FIRESTORE_EMULATOR_RESET: '1'
        run: >-
          npx --yes firebase-tools@15.33.0 emulators:exec
          --only auth,firestore
          --project demo-campus4change-rules
          "npm run test:firestore-rules && npm run test:firebase-auth"

      - name: Production Android bundle and release Kotlin compile
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          :app:createBundleReleaseJsAndAssets
          :app:compileReleaseKotlin

      - name: Android debug build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify release packaging requires a dedicated key
        working-directory: android
        shell: bash
        run: |
          set +e
          release_output=$(./gradlew --no-daemon --dry-run assembleRelease 2>&1)
          release_status=$?
          set -e

          if [ "$release_status" -eq 0 ]; then
            printf '%s\n' "$release_output"
            echo "Release build unexpectedly accepted missing signing credentials."
            exit 1
          fi

          if ! grep -Fq "Release builds require a dedicated keystore." <<<"$release_output"; then
            printf '%s\n' "$release_output"
            echo "Release build failed for a reason other than missing signing credentials."
            exit 1
          fi

          echo "Release signing guard rejected missing credentials as expected."
