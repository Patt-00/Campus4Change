name: Campus4Change Build and Lint

on:
  push:
    branches:
      - main
      - 'codex/firebase-auth-firestore'
  pull_request:
    branches:
      - main
      - 'codex/firebase-auth-firestore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c4c-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Java for Android builds
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install the Android NDK used by the project
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Focused JavaScript behavior tests
        run: npm test

      - name: Check for public Google Drive links
        run: npm run check:public-drive-links

      - name: Production Android bundle and release Kotlin compile
        working-directory: android
        run: >-
          ./gradlew --no-daemon
          :app:createBundleReleaseJsAndAssets
          :app:compileReleaseKotlin

      - name: Android debug build
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify release packaging requires a dedicated key
        working-directory: android
        shell: bash
        run: |
          set +e
          release_output=$(./gradlew --no-daemon --dry-run assembleRelease 2>&1)
          release_status=$?
          set -e

          if [ "$release_status" -eq 0 ]; then
            printf '%s\n' "$release_output"
            echo "Release build unexpectedly accepted missing signing credentials."
            exit 1
          fi

          if ! grep -Fq "Release builds require a dedicated keystore." <<<"$release_output"; then
            printf '%s\n' "$release_output"
            echo "Release build failed for a reason other than missing signing credentials."
            exit 1
          fi

          echo "Release signing guard rejected missing credentials as expected."

  macos-clean-build:
    # Run only when manually dispatched; keep macOS build minutes off normal PR checks.
    if: github.event_name == 'workflow_dispatch'
    name: Clean Android debug build on macOS
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${HOME}/Library/Android/sdk}"
          sdkmanager="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            echo "Android SDK manager not found: $sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          printf 'sdk.dir=%s\n' "$sdk_root" > android/local.properties

      - name: Install JavaScript dependencies from lockfile
        run: npm ci

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify package, version, and signature
        shell: bash
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          sdk_root="${ANDROID_HOME:-${HOME}/Library/Android/sdk}"
          metadata="$("$sdk_root/build-tools/37.0.0/aapt" dump badging "$apk" | sed -n '1p')"
          printf '%s\n' "$metadata"
          grep -Fq "package: name='com.campus4change' versionCode='10' versionName='1.4.2'" <<<"$metadata"
          "$sdk_root/build-tools/37.0.0/apksigner" verify --verbose "$apk"
          shasum -a 256 "$apk"
